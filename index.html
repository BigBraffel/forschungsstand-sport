<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forschungsstand Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: feste Themen-Seitenleiste links, Inhaltsspalte rechts; Abschnitte = Überblick, Ableitungen, Variablen, Abbildungen, Verlauf, Quellen, Methodik */
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #12161d;
  --ink-2: #4a5160;
  --ink-3: #6f7685;
  --line: #d9dee6;
  --accent: #1c5cab;
  --accent-soft: #e3edfa;
  --series-1: #2a78d6;
  --good: #0a7d0a;
  --good-bg: #e2f3e2;
  --warn: #8a5a00;
  --warn-bg: #fdf0d2;
  --crit: #b42f2f;
  --crit-bg: #fbe4e4;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12151a;
    --surface: #1a1e25;
    --surface-2: #232934;
    --ink: #eef0f3;
    --ink-2: #b9bfca;
    --ink-3: #9198a5;
    --line: #333a46;
    --accent: #6da7ec;
    --accent-soft: #1f2f45;
    --series-1: #3987e5;
    --good: #5fcf5f;
    --good-bg: #17301a;
    --warn: #f2c25a;
    --warn-bg: #3a2d10;
    --crit: #f08a8a;
    --crit-bg: #3d1c1c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151a;
  --surface: #1a1e25;
  --surface-2: #232934;
  --ink: #eef0f3;
  --ink-2: #b9bfca;
  --ink-3: #9198a5;
  --line: #333a46;
  --accent: #6da7ec;
  --accent-soft: #1f2f45;
  --series-1: #3987e5;
  --good: #5fcf5f;
  --good-bg: #17301a;
  --warn: #f2c25a;
  --warn-bg: #3a2d10;
  --crit: #f08a8a;
  --crit-bg: #3d1c1c;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 2.1rem; font-weight: 700; }
h2 { font-size: 1.55rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 24px 18px; display: flex; flex-direction: column; gap: 22px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .8rem; color: var(--ink-3); }
.side h4 { margin: 0 0 6px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.topics, .toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.topics li a, .topics li span, .toc a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--ink-2); font-size: .92rem;
}
.topics li a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.topics li span { color: var(--ink-3); }
.topics li span em { font-style: normal; font-size: .72rem; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.toc a:hover, .topics li a:hover { background: var(--surface-2); }

main { padding: 32px clamp(16px, 4vw, 56px) 80px; display: flex; flex-direction: column; gap: 48px; max-width: 1080px; }
section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.lead { color: var(--ink-2); max-width: 68ch; }

.status-bar { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .85rem; color: var(--ink-3); }
.status-bar b { color: var(--ink-2); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ev-hoch { color: var(--good); background: var(--good-bg); }
.ev-moderat { color: var(--warn); background: var(--warn-bg); }
.ev-niedrig { color: var(--crit); background: var(--crit-bg); }
.pill.neutral { color: var(--ink-2); background: var(--surface-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
.takeaways { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.takeaway { display: flex; flex-direction: column; gap: 8px; }
.takeaway .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.takeaway p { color: var(--ink-2); font-size: .95rem; }
.cite { font-size: .82rem; color: var(--ink-3); }
.cite a { color: var(--ink-3); }

.rx { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.rx .card { display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--accent); }
.rx .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.rx .value { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.25; }
.rx p { font-size: .9rem; color: var(--ink-2); }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--ink-2); font-size: .92rem; max-width: 75ch; }

.var { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; }
.var > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
.var > summary::-webkit-details-marker { display: none; }
.var > summary .q { font-size: .95rem; color: var(--ink-2); grid-column: 1 / -1; }
.var > summary h3::after { content: " ▾"; color: var(--ink-3); font-size: .9rem; }
.var[open] > summary h3::after { content: " ▴"; }
.var .body { padding: 0 22px 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px 28px; border-top: 1px solid var(--line); padding-top: 18px; }
.var .body h4 { margin: 0 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.var .body ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .93rem; }
.var .body p { font-size: .93rem; }
.crit-box { background: var(--surface-2); border-radius: 8px; padding: 14px 16px; grid-column: 1 / -1; }
.crit-box p { color: var(--ink-2); }
.vars { display: flex; flex-direction: column; gap: 10px; }

.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.fig { display: flex; flex-direction: column; gap: 10px; }
.fig.wide { grid-column: 1 / -1; }
.fig .cap { font-size: .85rem; color: var(--ink-3); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font-family: var(--font-body); font-size: 12px; }
.chart .muted { fill: var(--ink-3); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .mark { fill: var(--series-1); }
.chart .ci { stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; }
.chart .hit { fill: transparent; cursor: default; }
.chart .row:hover .mark, .chart .row:focus .mark { fill: var(--accent); }
.chart .row:hover .ci { stroke: var(--accent); }
.chart .row:hover .rowbg { fill: var(--surface-2); }
.rowbg { fill: transparent; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 280px;
  background: var(--ink); color: var(--bg); font-size: .8rem; line-height: 1.4;
  padding: 8px 10px; border-radius: 6px; opacity: 0; transition: opacity .1s;
}
.tip.show { opacity: 1; }
details.table-view summary { cursor: pointer; font-size: .82rem; color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
td.r, th.r { text-align: right; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0; }
.timeline::before { content: ""; position: absolute; left: 66px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl { display: grid; grid-template-columns: 56px 22px minmax(0, 1fr); gap: 0 12px; padding: 10px 0; }
.tl .yr { font-family: var(--font-mono); font-weight: 500; color: var(--ink-2); text-align: right; padding-top: 1px; }
.tl .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); margin: 6px 0 0 4px; position: relative; z-index: 1; }
.tl .txt { display: flex; flex-direction: column; gap: 4px; }
.tl .txt .t { font-weight: 600; }
.tl .txt p { font-size: .92rem; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .72rem; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.tag.conf { border-color: var(--good); color: var(--good); }
.tag.rel { border-color: var(--warn); color: var(--warn); }
.tag.contra { border-color: var(--crit); color: var(--crit); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  font: inherit; font-size: .85rem; padding: 5px 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.refs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.refs li { padding-left: 2em; text-indent: -2em; font-size: .92rem; }
.refs li .meta { display: inline-flex; gap: 6px; text-indent: 0; margin-left: 6px; vertical-align: 1px; }
.refs em { font-style: italic; }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.method ol { margin: 6px 0 0; padding-left: 20px; font-size: .92rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.method p { font-size: .92rem; color: var(--ink-2); }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .toc { flex-direction: row; flex-wrap: wrap; }
  .figs { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
.toc.sub { padding-left: 12px; margin-top: 2px; }
.toc.sub a { font-size: .85rem; padding: 4px 10px; }
.var .figrow { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px; }
.var .fig { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.var .fig h5 { margin: 0; font-family: var(--font-display); font-size: 1rem; font-weight: 600; }
.var .fig.wide { grid-column: 1 / -1; }
.pill.flag { color: var(--warn); background: var(--warn-bg); }
@media (max-width: 500px) { .var .figrow { grid-template-columns: 1fr; } }
.grp > summary { cursor: pointer; list-style: none; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); font-size: .92rem; display: flex; justify-content: space-between; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::after { content: "▸"; color: var(--ink-3); }
.grp[open] > summary::after { content: "▾"; }
.grp > summary:hover { background: var(--surface-2); }
.topics.sub { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 12px; }
.topics.sub li span { font-size: .86rem; padding: 5px 10px; }
.scr-bars { display: flex; flex-direction: column; gap: 6px; }
.scr-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 4px 12px; align-items: center; font-size: .86rem; }
.scr-row .lab { color: var(--ink-2); }
.scr-row .n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.scr-row .track { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.scr-row .fill { height: 100%; background: var(--series-1); border-radius: 3px; }

.topics li a.planned { color: var(--ink-3); }
.topics li a.planned em, .topics li span em { font-style: normal; font-size: .72rem; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.empty { padding: 28px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.toc button { all: unset; cursor: pointer; display: block; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); font-size: .92rem; }
.toc button:hover { background: var(--surface-2); }
.toc.sub button { font-size: .85rem; padding: 4px 10px; }
.toc button:focus-visible { outline: 2px solid var(--accent); }
.chart-bars svg, .chart-lineci svg, .chart-tiers svg { max-width: 520px; }
.zone-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.zone-scale div { border-radius: 6px; padding: 8px 10px; background: var(--surface-2); font-size: .82rem; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--series-1); }
.zone-scale b { font-family: var(--font-display); font-size: .95rem; }
@media (max-width: 700px) { .zone-scale { grid-template-columns: 1fr; } }

/* ----- Wirkungsübersicht (Matrix) und Supplement-Übersicht ----- */
.mx { padding: 0; overflow: hidden; }
.mx-cols, .mx-row > summary, .mx-grp > summary { display: grid; grid-template-columns: minmax(0, 1.7fr) 64px minmax(150px, 1fr) minmax(150px, 1fr); gap: 12px; align-items: center; padding: 12px 18px; }
.mx-cols { background: var(--surface-2); font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.mx-cols span:nth-child(2) { text-align: center; }
.mx-grp { border-bottom: 1px solid var(--line); }
.mx-grp:last-child { border-bottom: 0; }
.mx-grp > summary { cursor: pointer; list-style: none; background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
.mx-grp > summary::-webkit-details-marker, .mx-row > summary::-webkit-details-marker { display: none; }
.mx-gname { font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.mx-gname::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.mx-grp[open] > summary .mx-gname::before { transform: rotate(45deg); }
.mx-gname small { font-family: var(--font-body); font-size: .74rem; font-weight: 500; color: var(--ink-3); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
.mx-gmeta { grid-column: 2 / -1; font-size: .85rem; color: var(--ink-2); }
.mx-row { border-top: 1px solid var(--line); }
.mx-row > summary { cursor: pointer; list-style: none; }
.mx-row > summary:hover { background: var(--surface-2); }
.mx-row > summary:focus-visible, .mx-grp > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mx-name { padding-left: 18px; color: var(--accent); font-weight: 500; }
.mx-sup { display: block; font-size: .74rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); }
.grade { justify-self: center; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.grade.small { width: 24px; height: 24px; border-radius: 6px; font-size: .82rem; }
.g-A { background: var(--accent); color: var(--bg); }
.g-B { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); color: var(--ink); }
.g-C { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.g-D { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink-3); border: 1px dashed transparent; }
.mx-eff { display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--ink); }
.mx-eff svg { flex: none; }
.eff-nutzen svg { color: var(--good); }
.eff-schaden svg { color: var(--crit); }
.eff-neutral svg { color: var(--ink-2); }
.mx-warn { font-style: normal; font-size: .72rem; font-weight: 600; color: var(--crit); background: var(--crit-bg); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
.mx-evi { font-size: .84rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.mx-evi span { display: inline-flex; align-items: center; gap: 6px; }
.mx-evi svg { color: var(--ink-3); flex: none; }
.mx-detail { padding: 2px 18px 16px 36px; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }
.mx-detail p { margin: 0; }
.mx-detail .cite { font-size: .82rem; color: var(--ink-3); }
.mx-detail a.more { font-size: .85rem; font-weight: 600; }
.mx-empty { padding: 18px; color: var(--ink-3); }
.mx-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.mx-legend h3 { margin: 0 0 8px; }
.mx-legend dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; font-size: .88rem; }
.mx-legend dd { margin: 0; color: var(--ink-2); }
.mx-legend .eff-key { display: flex; align-items: center; gap: 8px; }
.sup-tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 4px 0 14px; }
.sup-tools input[type="search"] { flex: 1 1 260px; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.sup-tools input[type="search"]:focus-visible { outline: 2px solid var(--accent); border-color: var(--accent); }
.sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.sup-card { display: flex; flex-direction: column; gap: 10px; }
.sup-card h3 { margin: 0; font-size: 1.25rem; }
.sup-card .meta { font-size: .82rem; color: var(--ink-3); }
.sup-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sup-card li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: .9rem; }
.sup-card li small { display: block; color: var(--ink-3); font-size: .8rem; }
.sup-card h4 { margin: 4px 0 0; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.sup-card .go { margin-top: auto; align-self: flex-start; font-weight: 600; font-size: .9rem; }
@media (max-width: 760px) {
  .mx-cols { display: none; }
  .mx-row > summary, .mx-grp > summary { grid-template-columns: 1fr auto; gap: 8px 12px; }
  .mx-row > summary .mx-name { grid-column: 1; }
  .mx-row > summary .grade { grid-column: 2; grid-row: 1; }
  .mx-row > summary .mx-eff, .mx-row > summary .mx-evi { grid-column: 1 / -1; padding-left: 18px; }
  .mx-evi { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .mx-gmeta { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="brand">Forschungsstand Sport<small>Training &amp; Ernährung – evidenzbasiert</small></div>
    <nav aria-label="Themen" id="nav-topics"></nav>
    <nav aria-label="Auf dieser Seite">
      <h4>Auf dieser Seite</h4>
      <ul class="toc" id="toc"></ul>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* ===== Themenverzeichnis: neue Themen hier eintragen (Datei data/topics/<id>.json, Register data/screening/<id>.json) ===== */
const NAV = [
  { group: "Training", items: [
    { id: "maximalkraft", title: "Maximalkrafttraining" },
    { id: "hypertrophie", title: "Hypertrophie" },
    { id: "ausdauer", title: "Ausdauertraining", children: [
      { id: "zone-1", title: "Zone 1 · Regeneration", var: "zone1" },
      { id: "zone-2", title: "Zone 2 · Grundlage", var: "zone2" },
      { id: "zone-3", title: "Zone 3 · Tempo", var: "zone3" },
      { id: "zone-4", title: "Zone 4 · Schwelle", var: "zone4" },
      { id: "zone-5", title: "Zone 5 · VO₂max", var: "zone5" } ] },
    { id: "regeneration", title: "Regeneration nach Krafttraining" } ] },
  { group: "Ernährung", items: [
    { title: "Makronährstoffe", children: [ { id: "protein", title: "Protein" } ] },
    { title: "Supplemente", children: [
      { id: "supplemente", title: "Übersicht aller Supplemente" },
      { id: "kreatin", title: "Kreatin" },
      { id: "omega-3", title: "Omega-3-Fettsäuren" },
      { id: "zink", title: "Zink" },
      { id: "magnesium", title: "Magnesium" },
      { id: "vitamin-d-k2", title: "Vitamin D3 und K2" } ] } ] }
];
const AVAILABLE = ["maximalkraft", "hypertrophie", "ausdauer", "regeneration", "protein", "kreatin", "omega-3", "zink", "magnesium", "vitamin-d-k2"];

const PAGES = ["supplemente"]; /* Seiten ohne eigene Themendatei */
const SUPPS = ["kreatin", "omega-3", "zink", "magnesium", "vitamin-d-k2"]; /* Supplemente mit Wirkungsübersicht */
const $ = (id) => document.getElementById(id);
const evLabel = { hoch: "Evidenz hoch", moderat: "Evidenz moderat", niedrig: "Evidenz niedrig" };
const TAGS = { neu: ["Neuer Befund", ""], conf: ["Bestätigt", "conf"], rel: ["Relativiert", "rel"], contra: ["Widerspricht", "contra"] };
const fmt = (n) => n.toFixed(2).replace(".", ",");
const fmt1 = (n) => n.toFixed(1).replace(".", ",");
const fmtN = (n) => Number.isInteger(n) ? String(n) : fmt(n);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
const fmtDate = (s) => s.split("-").reverse().join(".");
const cache = {};
let T = null, active = "alle", pendingScroll = null, mxArea = "alle";

/* ----- Navigation ----- */
function routeOf(hash) {
  const h = (hash || "").replace("#", "");
  for (const g of NAV) for (const it of g.items) {
    if (it.id === h) return { topic: it.id };
    for (const c of it.children || []) if (c.id === h) return c.var ? { topic: it.id, scroll: "var-" + c.var } : { topic: c.id };
  }
  return { topic: "maximalkraft" };
}
function navItem(it, cur) {
  const ok = AVAILABLE.includes(it.id) || PAGES.includes(it.id);
  return `<li><a href="#${it.id}" class="${it.id === cur ? "active" : ""}${ok ? "" : " planned"}"${it.id === cur ? ' aria-current="page"' : ""}>${it.title}${ok ? "" : " <em>geplant</em>"}</a></li>`;
}
function renderNav(cur) {
  $("nav-topics").innerHTML = NAV.map((g, gi) => `<h4${gi ? ' style="margin-top:14px"' : ""}>${g.group}</h4><ul class="topics">${g.items.map(it => {
    if (!it.children) return navItem(it, cur);
    const open = it.id === cur || it.children.some(c => c.id === cur || (!c.var && cur === c.id)) || it.children.some(c => !c.var && c.id === cur);
    const head = it.id ? `<a href="#${it.id}" class="${it.id === cur ? "active" : ""}${AVAILABLE.includes(it.id) ? "" : " planned"}" style="flex:1">${it.title}${AVAILABLE.includes(it.id) ? "" : " <em>geplant</em>"}</a>` : it.title;
    return `<li><details class="grp"${open ? " open" : ""}><summary>${head}</summary><ul class="topics sub">${it.children.map(c => c.var
      ? `<li><a href="#${c.id}"${AVAILABLE.includes(it.id) ? "" : ' class="planned"'}>${c.title}</a></li>` : navItem(c, cur)).join("")}</ul></details></li>`;
  }).join("")}</ul>`).join("");
}
function scrollToId(id) { const el = $(id); if (!el) return; if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute("href").slice(1);
  if (id.startsWith("ref-") || id.startsWith("var-")) { e.preventDefault(); scrollToId(id); }
});
document.addEventListener("click", (e) => { const b = e.target.closest("[data-scroll]"); if (b) scrollToId(b.dataset.scroll); });

/* ----- Laden ----- */
async function load() {
  const r = routeOf(location.hash);
  renderNav(location.hash.replace("#", "") || r.topic);
  if (r.topic === "supplemente") return renderSupOverview();
  if (!AVAILABLE.includes(r.topic)) return renderPlanned(r.topic);
  if (!cache[r.topic]) {
    try { cache[r.topic] = await (await fetch(`data/topics/${r.topic}.json`)).json(); }
    catch (e) { $("main").innerHTML = `<section><div class="card empty"><h2>Thema konnte nicht geladen werden</h2><p>Bitte die Seite neu laden.</p></div></section>`; return; }
  }
  T = cache[r.topic]; active = "alle";
  renderTopic(T);
  document.title = `Forschungsstand ${T.title}`;
  const pend = pendingScroll; pendingScroll = null;
  if (r.scroll || pend) setTimeout(() => scrollToId(r.scroll || pend), 50); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", load);
function findTitle(id) { for (const g of NAV) for (const it of g.items) { if (it.id === id) return it.title; for (const c of it.children || []) if (c.id === id) return c.title; } return id; }
function renderPlanned(id) {
  $("toc").innerHTML = "";
  $("main").innerHTML = `<section><h1>${findTitle(id)}</h1><div class="card empty"><p>Dieses Thema wird gerade aufgebaut. Sobald die erste Literatursichtung abgeschlossen ist, erscheint hier der Forschungsstand.</p></div></section>`;
}

/* ----- Thema rendern ----- */
function citeList(keys) { return "[" + keys.map(k => `<a href="#ref-${k}">${T.sources[k] ? T.sources[k].short : k}</a>`).join("; ") + "]"; }
function renderTopic(t) {
  const srcN = Object.keys(t.sources).length;
  const years = Object.values(t.sources).map(s => s.year).filter(Boolean);
  const intro = t.intro ? `<div class="card" style="display:flex;flex-direction:column;gap:8px">${t.intro}</div>` : "";
  $("main").innerHTML = `
  <section id="ueberblick">
    <div class="status-bar">
      <span><b>Stand:</b> ${fmtDate(t.stand)}</span>
      <span><b>Quellen:</b> <span class="num">${srcN}</span> (${Math.min(...years)}–${Math.max(...years)})</span>
      <span><b>Automatische Aktualisierung:</b> alle 2 Wochen freitags</span>
    </div>
    <h1>${t.title}</h1>
    <p class="lead">${t.lead}</p>
    ${intro}
    <h2>Kurzfazit</h2>
    <div class="takeaways">${t.takeaways.map(x => `
      <article class="card takeaway">
        <div class="head"><h3>${x.t}</h3><span class="pill ev-${x.ev}">${evLabel[x.ev]}</span></div>
        <p>${x.p}</p><span class="cite">${citeList(x.s)}</span>
      </article>`).join("")}</div>
  </section>
  ${t.matrix ? `<section id="wirkung">
    <h2>Wirkungsübersicht</h2>
    <p class="lead">Alle untersuchten Wirkungen auf einen Blick: wie sicher der Befund ist (Grad), in welche Richtung und wie stark etwas wirkt (Effekt) und wie breit die Datenbasis ist (Evidenz). Für Befund und Quellen eine Zeile anklicken.</p>
    <div class="filters" role="group" aria-label="Bereich filtern" id="mx-filters"></div>
    <div class="card mx" id="mx" style="margin-top:12px"></div>
    <details class="card table-view" style="margin-top:12px"><summary>Wie werden Grad und Effekt bestimmt?</summary><div style="margin-top:14px">${mxLegend()}</div></details>
  </section>` : ""}
  <section id="ableitungen">
    <h2>${t.rxtitle || "Ableitungen für die Praxis"}</h2>
    <p class="lead">${t.rxlead}</p>
    <div class="rx">${t.rx.map(c => `<div class="card"><span class="label">${c.label}</span><span class="value">${c.value}</span><p>${c.text}</p><span class="cite">[${c.cite}]</span></div>`).join("")}</div>
    ${t.note ? `<p class="note">${t.note}</p>` : ""}
  </section>
  <section id="variablen">
    <h2>${t.varstitle || "Im Detail"}</h2>
    <p class="lead">${t.varslead || "Je Abschnitt: Befunde, eigene Abbildungen aus den berichteten Kennzahlen, kritische Einordnung und Quellen. Effektstärken (SMD/ES) sind standardisierte Mittelwertunterschiede: etwa 0,2 gilt als klein, 0,5 als mittel, 0,8 als groß."}</p>
    <div class="vars">${t.vars.map(v => `
      <details class="card var" id="var-${v.id}" open>
        <summary><h3>${v.name}</h3><span class="pill ev-${v.ev}">${evLabel[v.ev]}</span><span class="q">${v.q}</span></summary>
        <div class="body">
          <div><h4>Befunde</h4><ul>${v.key.map(k => `<li>${k}</li>`).join("")}</ul></div>
          <div><h4>Quellen</h4><ul>${v.s.map(k => `<li><a href="#ref-${k}">${t.sources[k].short}</a> · ${t.sources[k].type}</li>`).join("")}</ul></div>
          ${v.figs && v.figs.length ? `<div class="figrow">${v.figs.map(f => `
            <figure class="fig${f.wide || f.type === "forest" || f.type === "dots" ? " wide" : ""}" style="margin:0">
              <h5>${f.title}</h5><div class="chart chart-${f.type}" id="${f.id}"></div>
              <figcaption class="cap">${f.cap}</figcaption>
              <details class="table-view"><summary>Als Tabelle anzeigen</summary><div class="tbl-wrap" id="${f.id}-tbl"></div></details>
            </figure>`).join("")}</div>` : ""}
          <div class="crit-box"><h4>Kritische Einordnung</h4><p>${v.critic}</p></div>
        </div>
      </details>`).join("")}</div>
  </section>
  <section id="verlauf">
    <h2>Forschungsverlauf</h2>
    <p class="lead">Wie sich der Kenntnisstand entwickelt hat. Markiert ist, ob eine Arbeit frühere Befunde bestätigt, relativiert oder ihnen widerspricht.</p>
    <div class="filters" role="group" aria-label="Verlauf filtern" id="tl-filters"></div>
    <ol class="timeline" id="timeline"></ol>
  </section>
  <section id="quellen">
    <h2>Quellen</h2>
    <p class="lead">Zitiert nach APA 7 (deutsche Fassung). Die Markierung zeigt Studientyp und ob Volltext oder nur Abstract ausgewertet wurde.</p>
    <ol class="refs">${Object.entries(t.sources).sort((a, b) => a[1].apa.localeCompare(b[1].apa, "de")).map(([k, s]) => `<li id="ref-${k}">${s.apa}${s.doi ? ` <a href="https://doi.org/${s.doi}">https://doi.org/${s.doi}</a>` : ""}<span class="meta"><span class="pill neutral">${s.type}</span><span class="pill neutral">${s.basis}</span>${s.flag ? `<span class="pill flag">${s.flag}</span>` : ""}</span></li>`).join("")}</ol>
  </section>
  <section id="methodik">
    <h2>Methodik</h2>
    <div class="method">
      <div class="card"><h3>Evidenzhierarchie</h3><ol>
        <li>Positionspapiere auf Basis von Übersichtsarbeiten (Umbrella Reviews)</li>
        <li>Netzwerk-Metaanalysen und Metaanalysen / Metaregressionen</li>
        <li>Systematische Reviews ohne Metaanalyse</li>
        <li>Randomisierte kontrollierte Einzelstudien</li>
        <li>Sonstige Studien (historisch, nicht randomisiert)</li></ol></div>
      <div class="card"><h3>Evidenzgrad je Aussage</h3>
        <p><span class="pill ev-hoch">Hoch</span> mehrere Metaanalysen stimmen überein, aktuelle Bestätigung.</p>
        <p style="margin-top:8px"><span class="pill ev-moderat">Moderat</span> Metaanalysen vorhanden, aber Widersprüche, kleine Effekte oder methodische Grenzen.</p>
        <p style="margin-top:8px"><span class="pill ev-niedrig">Niedrig</span> nur systematische Reviews ohne Metaanalyse oder wenige Studien.</p></div>
      <div class="card"><h3>Grenzen</h3><p>${t.limits || "Ausgewertet wurden überwiegend Abstracts; Zahlen stammen aus den Abstracts. Abbildungen der Originalarbeiten werden aus urheberrechtlichen Gründen nicht übernommen. Die automatische Aktualisierung läuft alle zwei Wochen freitags über eine feste PubMed-Suchanfrage je Thema; jeder neue Treffer wird anhand von Einschlusskriterien gesichtet, ergänzt durch eine Websuche nach Preprints und Positionspapieren."}</p></div>
    </div>
    <div class="card" id="screening">
      <h3>Screening-Register</h3>
      <p class="cap" id="scr-meta" style="margin:6px 0 12px">Wird geladen …</p>
      <div class="scr-bars" id="scr-bars"></div>
      <details class="table-view" style="margin-top:12px"><summary>Vorgemerkte Arbeiten anzeigen</summary><div class="tbl-wrap" id="scr-v"></div></details>
      <details class="table-view" style="margin-top:6px"><summary>Aufgenommene PubMed-Einträge anzeigen</summary><div class="tbl-wrap" id="scr-a"></div></details>
    </div>
    <div class="card"><h3>Änderungsprotokoll</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Datum</th><th>Änderung</th></tr></thead>
      <tbody>${t.changelog.map(c => `<tr><td class="num">${c.d}</td><td>${c.t}</td></tr>`).join("")}</tbody></table></div></div>
  </section>`;
  $("toc").innerHTML = [["ueberblick", "Kurzfazit"], ...(t.matrix ? [["wirkung", "Wirkungsübersicht"]] : []), ["ableitungen", "Ableitungen"], ["variablen", t.varstitle || "Im Detail"]].map(([i, l]) => `<li><button type="button" data-scroll="${i}">${l}</button></li>`).join("")
    + `<li><ul class="toc sub">${t.vars.map(v => `<li><button type="button" data-scroll="var-${v.id}">${v.name}</button></li>`).join("")}</ul></li>`
    + [["verlauf", "Forschungsverlauf"], ["quellen", "Quellen"], ["methodik", "Methodik"]].map(([i, l]) => `<li><button type="button" data-scroll="${i}">${l}</button></li>`).join("");
  if (t.matrix) { mxArea = "alle"; renderMx(); $("mx-filters").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; mxArea = b.dataset.f; renderMx(); }); }
  renderTimeline();
  $("tl-filters").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; active = b.dataset.f; renderTimeline(); });
  t.vars.forEach(v => (v.figs || []).forEach(f => CHARTS[f.type](f.id, f.data, f.opts || {})));
  loadScreening(t.id);
}

/* ----- Wirkungsübersicht ----- */
const GRADE = {
  A: "Grad A – hoch: mehrere übereinstimmende Metaanalysen oder eine große Metaanalyse (mind. 20 Studien bzw. 1000 Teilnehmende) mit eindeutigem Ergebnis.",
  B: "Grad B – moderat: mindestens eine Metaanalyse mit 8 oder mehr Studien, Ergebnisse überwiegend übereinstimmend.",
  C: "Grad C – niedrig: wenige Studien, widersprüchliche Metaanalysen, hohe Heterogenität oder nur eingeschränkt übertragbare Population.",
  D: "Grad D – sehr niedrig: sehr wenige oder kleine Studien, überwiegend indirekte Hinweise (z. B. Tierstudien)." };
const AREAS = [["alle", "Alle"], ["Leistung", "Leistung"], ["Regeneration", "Regeneration"], ["Gesundheit", "Gesundheit"]];
const KAT = [["kraft", "Kraft und Muskelfunktion"], ["masse", "Muskelmasse und Körperbau"], ["ausdauer", "Schnellkraft und Ausdauer"], ["regeneration", "Erholung und Regeneration"],
  ["entzuendung", "Entzündung"], ["hormone", "Hormone"], ["herz", "Herz-Kreislauf und Stoffwechsel"], ["stoffwechsel", "Herz-Kreislauf und Stoffwechsel"], ["infekte", "Immunsystem und Infekte"],
  ["knochen", "Knochen"], ["gehirn", "Gehirn und Schlaf"], ["status", "Nährstoffstatus"], ["sicherheit", "Sicherheit und Nebenwirkungen"]];
const fmtInt = (n) => Number(n).toLocaleString("de-DE");
const ICON_DOC = '<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path d="M2 1h6l3 3v10H2z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 7h5M4 9.5h5M4 12h3" stroke="currentColor" stroke-width="1.2"/></svg>';
const ICON_PERS = '<svg width="13" height="14" viewBox="0 0 13 14" aria-hidden="true"><circle cx="6.5" cy="4" r="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.2 13.3c.6-3 2.7-4.6 5.3-4.6s4.7 1.6 5.3 4.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
function effLabel(it) {
  if (it.m === 0) return "Kein Effekt";
  if (it.m === null || it.m === undefined) return "Uneinheitlich";
  const dir = it.d === "auf" ? "Zunahme" : "Abnahme";
  if (it.m === -1) return `${dir}, Größe nicht angegeben`;
  return `${["", "Sehr kleine", "Kleine", "Mittlere", "Große"][it.m]} ${dir}`;
}
function effGlyph(it) {
  const W = 52, H = 20;
  if (it.m === 0) return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect x="2" y="9" width="16" height="3" rx="1.5" fill="currentColor"/></svg>`;
  if (it.m === null || it.m === undefined) return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M2 7.5c3-3 5 3 8 0s5-3 8 0M2 13.5c3-3 5 3 8 0s5-3 8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const up = it.d === "auf";
  const arrow = up ? `<path d="M10 2 4 9h4v9h4V9h4z" fill="currentColor"/>` : `<path d="M10 18 4 11h4V2h4v9h4z" fill="currentColor"/>`;
  const bars = [0, 1, 2, 3].map(i => { const h = 6 + i * 4; return `<rect x="${24 + i * 7}" y="${18 - h}" width="5" height="${h}" rx="1.5" fill="${it.m > i ? "currentColor" : "var(--line)"}"/>`; }).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${arrow}${bars}</svg>`;
}
function mxRow(it, opt) {
  const cites = opt.cites(it.s);
  return `<details class="mx-row"><summary>
      <span class="mx-name">${opt.prefix ? `<span class="mx-sup">${opt.prefix}</span>` : ""}${it.n}</span>
      <span class="grade g-${it.g}" title="${esc(GRADE[it.g])}" aria-label="${esc(GRADE[it.g].split(":")[0])}">${it.g}</span>
      <span class="mx-eff eff-${it.b}">${effGlyph(it)}<span>${effLabel(it)}${it.b === "schaden" ? ' <em class="mx-warn">unerwünscht</em>' : ""}</span></span>
      <span class="mx-evi"><span>${ICON_DOC}${it.k ? `${fmtInt(it.k)} Studien` : "Studienzahl k. A."}</span><span>${ICON_PERS}${it.p ? `${fmtInt(it.p)} Teilnehmende` : "Teilnehmende k. A."}</span></span>
    </summary>
    <div class="mx-detail"><p>${it.t}</p><span class="cite">${cites}</span>${opt.more(it)}</div></details>`;
}
function mxGroup(title, sub, items, opt, open = true) {
  const src = new Set(items.flatMap(i => opt.srcKeys ? opt.srcKeys(i) : i.s)).size;
  return `<details class="mx-grp"${open ? " open" : ""}><summary>
      <span class="mx-gname">${title}${sub ? `<small>${sub}</small>` : ""}</span>
      <span class="mx-gmeta">${items.length} ${items.length === 1 ? "Wirkung" : "Wirkungen"} · ${src} ${src === 1 ? "Quelle" : "Quellen"}</span>
    </summary>${items.map(i => mxRow(i, opt)).join("")}</details>`;
}
const MX_COLS = `<div class="mx-cols" aria-hidden="true"><span>Ziel · Wirkung</span><span>Grad</span><span>Effekt</span><span>Evidenz</span></div>`;
function renderMx() {
  $("mx-filters").innerHTML = AREAS.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === mxArea}">${l}</button>`).join("");
  const groups = T.matrix.filter(g => mxArea === "alle" || g.bereich === mxArea);
  const opt = { cites: (keys) => citeList(keys), more: (it) => `<a class="more" href="#var-${it.v}">Zum Abschnitt im Detail →</a>` };
  $("mx").innerHTML = MX_COLS + (groups.length ? groups.map(g => mxGroup(g.ziel, mxArea === "alle" ? g.bereich : "", g.items, opt)).join("") : `<p class="mx-empty">In diesem Bereich wurden keine Wirkungen untersucht.</p>`);
}
function mxLegend() {
  const ex = (m, d, b) => `<span class="eff-key mx-eff eff-${b}">${effGlyph({ m, d })}<span>${effLabel({ m, d })}</span></span>`;
  return `<div class="mx-legend">
    <div><h3>Grad: Wie sicher ist der Befund?</h3><dl>${["A", "B", "C", "D"].map(g => `<dt><span class="grade small g-${g}">${g}</span></dt><dd>${GRADE[g].split(": ")[1]}</dd>`).join("")}</dl>
      <p class="cap" style="margin-top:10px">Der Grad beschreibt die Verlässlichkeit, nicht die Stärke der Wirkung. Auch „Kein Effekt“ kann mit Grad A belegt sein.</p></div>
    <div><h3>Effekt: Wie stark ist die Wirkung?</h3><dl>
      <dt>${ex(1, "auf", "nutzen")}</dt><dd>SMD unter 0,2 bzw. Risikoänderung unter 10 %</dd>
      <dt>${ex(2, "auf", "nutzen")}</dt><dd>SMD 0,2–0,49 bzw. 10–24 %</dd>
      <dt>${ex(3, "auf", "nutzen")}</dt><dd>SMD 0,5–0,79 bzw. 25–49 %</dd>
      <dt>${ex(4, "auf", "nutzen")}</dt><dd>SMD ab 0,8 bzw. ab 50 %</dd>
      <dt>${ex(0, null, "neutral")}</dt><dd>nicht signifikant</dd>
      <dt>${ex(null, null, "neutral")}</dt><dd>Metaanalysen widersprechen sich</dd></dl>

function supItems() {
  const q = supQuery.trim().toLowerCase();
  const out = [];
  SUPPS.forEach(id => { const t = cache[id]; if (!t || !t.matrix) return;
    t.matrix.forEach(g => { if (supArea !== "alle" && g.bereich !== supArea) return;
      g.items.forEach(it => { const hay = `${t.title} ${g.ziel} ${it.n} ${it.t} ${(KAT.find(k => k[0] === g.kat) || ["", ""])[1]}`.toLowerCase();
        if (!q || hay.includes(q)) out.push({ ...it, top: t, grp: g }); }); }); });
  return out;
}
const rank = (it) => "ABCD".indexOf(it.g) * 10 - (it.b === "nutzen" && it.m > 0 ? it.m : 0);
function supOpt() {
  return { prefix: null, srcKeys: (i) => i.s.map(k => i.top.id + k),
    cites: function (keys) { return "[" + keys.map(k => this.cur.top.sources[k].short).join("; ") + "]"; },
    more: (it) => `<a class="more" href="#${it.top.id}" data-goto="var-${it.v}">Zu ${it.top.title} →</a>` };
}
function drawSup() {
  $("sup-view-btns").innerHTML = [["sup", "Nach Supplement"], ["ziel", "Nach Ziel"]].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === supView}">${l}</button>`).join("");
  $("sup-area-btns").innerHTML = AREAS.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === supArea}">${l}</button>`).join("");
  const items = supItems();
  if (!items.length) { $("sup-out").innerHTML = `<div class="card mx-empty">Keine passenden Wirkungen gefunden.</div>`; return; }
  if (supView === "sup") {
    $("sup-out").innerHTML = `<div class="sup-grid">${SUPPS.map(id => {
      const t = cache[id]; const mine = items.filter(i => i.top.id === id); if (!mine.length) return "";
      const pos = mine.filter(i => i.b === "nutzen" && i.m !== 0).sort((a, b) => rank(a) - rank(b)).slice(0, 4);
      const none = mine.filter(i => i.m === 0).sort((a, b) => rank(a) - rank(b)).slice(0, 2);
      const neg = mine.filter(i => i.b === "schaden");
      const li = (i) => `<li><span class="grade small g-${i.g}" title="${esc(GRADE[i.g])}">${i.g}</span><span>${i.n}<small>${effLabel(i)}</small></span></li>`;
      return `<article class="card sup-card">
        <h3><a href="#${id}">${t.title}</a></h3>
        <span class="meta">${mine.length} ${mine.length === 1 ? "Wirkung" : "Wirkungen"} · ${Object.keys(t.sources).length} Quellen · Stand ${fmtDate(t.stand)}</span>
        ${pos.length ? `<h4>Belegte Wirkungen</h4><ul>${pos.map(li).join("")}</ul>` : ""}
        ${none.length ? `<h4>Kein Effekt</h4><ul>${none.map(li).join("")}</ul>` : ""}
        ${neg.length ? `<h4>Zu beachten</h4><ul>${neg.map(li).join("")}</ul>` : ""}
        <a class="go" href="#${id}" data-goto="wirkung">Alle Wirkungen ansehen →</a>
      </article>`; }).join("")}</div>`;
  } else {
    const opt = supOpt();
    const seen = [];
    const html = KAT.filter(([k, l]) => { if (seen.includes(l)) return false; seen.push(l); return true; }).map(([k, label]) => {
      const keys = KAT.filter(x => x[1] === label).map(x => x[0]);
      const rows = items.filter(i => keys.includes(i.grp.kat)).sort((a, b) => rank(a) - rank(b) || a.top.title.localeCompare(b.top.title, "de"));
      if (!rows.length) return "";
      const sup = new Set(rows.map(r => r.top.id)).size;

    }).join("");
    $("sup-out").innerHTML = `<div class="card mx">${MX_COLS}${html}</div>`;

}

/* ----- Tooltip und Tabellen ----- */
const tip = $("tip");
document.body.style.position = "relative";
function showTip(evt, html) {
  tip.innerHTML = html; tip.classList.add("show");
  const pad = 14, w = tip.offsetWidth;
  let x = evt.clientX + pad + window.scrollX, y = evt.clientY + pad + window.scrollY;
  if (evt.clientX + pad + w > window.innerWidth - 8) x = evt.clientX + window.scrollX - w - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.classList.remove("show"); }
function mount(id, svg, tbl) {
  const c = $(id); if (!c) return; c.innerHTML = svg; $(id + "-tbl").innerHTML = tbl;
  c.querySelectorAll(".row").forEach(r => {
    r.addEventListener("mousemove", e => showTip(e, r.dataset.tip));
    r.addEventListener("mouseleave", hideTip);
    r.addEventListener("focus", () => { const b = r.getBoundingClientRect(); showTip({ clientX: b.left + b.width / 2, clientY: b.top }, r.dataset.tip); });
    r.addEventListener("blur", hideTip);
  });
}
const table = (head, rows) => `<table><thead><tr>${head.map((h, i) => `<th${i ? ' class="r"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="r num"' : ""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

    const step = (W - l - r) / rows.length, bw = 54, y = v => t + (1 - v / o.max) * (H - t - b);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Abnehmender Ertrag">`;
    o.ticks.forEach(v => { s += `<line class="grid" x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}"/><text class="muted num" x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
    rows.forEach((d, i) => {
      const x0 = l + step * i + (step - bw) / 2, cx = x0 + bw / 2;
      const tt = `<b>${d.l}</b><br>${d.v === null ? "kein sicherer Zusatznutzen" : d.v === 0 ? "bereits wirksam" : "nötig: " + d.txt}<br>${o.src || ""}`;
      let m;
      if (d.v === null) m = `<rect x="${x0}" y="${y(o.max)}" width="${bw}" height="${y(0) - y(o.max)}" rx="4" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-dasharray="5 4"/><text x="${cx}" y="${y(o.max * 0.6)}" text-anchor="middle" style="font-size:11px">kein</text><text x="${cx}" y="${y(o.max * 0.6) + 14}" text-anchor="middle" style="font-size:11px">sicherer</text><text x="${cx}" y="${y(o.max * 0.6) + 28}" text-anchor="middle" style="font-size:11px">Nutzen</text>`;
      else if (d.v === 0) m = `<line x1="${x0}" x2="${x0 + bw}" y1="${y(0)}" y2="${y(0)}" stroke="var(--series-1)" stroke-width="3" stroke-linecap="round"/><text x="${cx}" y="${y(0) - 26}" text-anchor="middle" style="font-size:11px">bereits</text><text x="${cx}" y="${y(0) - 12}" text-anchor="middle" style="font-size:11px">wirksam</text>`;
      else m = `<path class="mark" d="${bar(x0, y(d.v), bw, y(0))}"/><text class="num" x="${cx}" y="${y(d.v) - 6}" text-anchor="middle" style="fill:var(--ink)">${d.txt}</text>`;
      s += `<g class="row" tabindex="0" data-tip="${esc(tt)}"><rect class="hit" x="${l + step * i}" y="${t}" width="${step}" height="${H - t - b}"/>${m}<text x="${cx}" y="${H - b + 18}" text-anchor="middle">${d.l}</text></g>`;
    });
    s += `<text class="muted" x="${l + (W - l - r) / 2}" y="${H - 6}" text-anchor="middle">${o.xlab || ""}</text></svg>`;
    mount(id, s, table(["Stufe", "Wert"], rows.map(d => [d.l, d.v === null ? "kein sicherer Zusatznutzen" : d.v === 0 ? "bereits wirksam" : d.txt])));
  }
};
load();
</script>
</body>
</html>
